name: SAID CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: said_ci
          POSTGRES_USER: said_ci
          POSTGRES_PASSWORD: said_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U said_ci -d said_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Check clean migration on SQLite
        env:
          SAID_DATABASE_URL: sqlite:////tmp/said-migration-ci.db
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
        run: |
          alembic upgrade head
          alembic current
          alembic upgrade head
      - name: Verify migration on PostgreSQL with real constraints
        env:
          SAID_DATABASE_URL: postgresql+psycopg://said_ci:said_ci_password@localhost:5432/said_ci
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import inspect, text
          from said.main import engine
          inspector = inspect(engine)
          expected = {'devices', 'theft_reports', 'audit_events', 'ownership_claims', 'alembic_version'}
          assert expected <= set(inspector.get_table_names())
          assert inspector.get_foreign_keys('theft_reports')
          assert inspector.get_foreign_keys('ownership_claims')
          assert 'institution_id' in {c['name'] for c in inspector.get_columns('devices')}
          assert 'institution_id' in {c['name'] for c in inspector.get_columns('audit_events')}
          assert 'citizen_subject' in {c['name'] for c in inspector.get_columns('citizen_requests')}
          assert 'citizen_subject' in {c['name'] for c in inspector.get_columns('citizen_link_intents')}
          assert inspector.get_foreign_keys('citizen_link_intents')
          assert inspector.get_foreign_keys('ceir_simulations')
          assert inspector.get_foreign_keys('ceir_simulation_events')
          assert inspector.get_foreign_keys('ceir_mock_exchanges')
          assert inspector.get_foreign_keys('ceir_mock_exchange_events')
          assert inspector.get_foreign_keys('ceir_mock_investigations')
          assert inspector.get_foreign_keys('ceir_mock_provenance')
          assert inspector.get_foreign_keys('ceir_mock_assessments')
          assert inspector.get_foreign_keys('ceir_mock_review_ledger')
          assert inspector.get_foreign_keys('ceir_mock_appeals')
          assert inspector.get_foreign_keys('ceir_mock_checkpoints')
          assert inspector.get_foreign_keys('ceir_mock_legal_holds')
          assert inspector.get_foreign_keys('ceir_mock_retention_approvals')
          assert 'opened_by' in {c['name'] for c in inspector.get_columns('ceir_mock_investigations')}
          assert 'imei_token' in {c['name'] for c in inspector.get_columns('ceir_mock_observations')}
          assert 'reviewed_by' in {c['name'] for c in inspector.get_columns('ownership_claims')}
          assert 'actor_reference' in {c['name'] for c in inspector.get_columns('audit_events')}
          assert any(c['name'] == 'uq_one_ownership_claim_per_device_phase2'
                     for c in inspector.get_unique_constraints('ownership_claims'))
          with engine.connect() as db:
              assert db.scalar(text("SELECT version_num FROM alembic_version")) == "0014_assurance"
          PY
      - name: Verify PostgreSQL row-level security with restricted database role
        env:
          SAID_DATABASE_URL: postgresql+psycopg://said_ci:said_ci_password@localhost:5432/said_ci
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
        run: python tests/pg_rls_integration.py
      - name: Verify concurrent PostgreSQL CEIR case writers
        env:
          SAID_DATABASE_URL: postgresql+psycopg://said_ci:said_ci_password@localhost:5432/said_ci
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
          SAID_CONCURRENCY_TEST_DB: ephemeral-ci-only
        run: python tests/pg_concurrency_integration.py
      - name: Fault-injection rollback and competing appeals in PostgreSQL
        env:
          SAID_DATABASE_URL: postgresql+psycopg://said_ci:said_ci_password@localhost:5432/said_ci
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
          SAID_CONCURRENCY_TEST_DB: ephemeral-ci-only
        run: python tests/pg_fault_injection_integration.py

      - name: Verify concurrent sandbox status revisions and event rollback
        env:
          SAID_DATABASE_URL: postgresql+psycopg://said_ci:said_ci_password@localhost:5432/said_ci
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
          SAID_CONCURRENCY_TEST_DB: ephemeral-ci-only
        run: python tests/pg_revision_resilience.py

      - name: Verify SAID security release workflow policy (no deployment)
        run: python -m said.release_gate --workflow .github/workflows/ci.yml
