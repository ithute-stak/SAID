name: SAID CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Check clean migration on SQLite
        env:
          SAID_DATABASE_URL: sqlite:////tmp/said-migration-ci.db
          SAID_ADMIN_API_KEY: ci-test-secret-at-least-32-characters-1234
        run: |
          alembic upgrade head
          alembic current
          alembic upgrade head
