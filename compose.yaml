services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: said
      POSTGRES_USER: said
      POSTGRES_PASSWORD: said_local_only
    volumes:
      - said_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U said -d said"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  said_postgres:
